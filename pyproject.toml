[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaot"
version = "3.0.0"
description = "AlphaOT: offline cross-population functional convergence analysis"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow", "scipy", "matplotlib"]

[project.scripts]
alphaot-run = "alphaot.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
